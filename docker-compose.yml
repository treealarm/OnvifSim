# Linux: host networking, so WS-Discovery multicast reaches the cameras and every camera answers on
# its own port as it would on the LAN. Docker Desktop (Windows, macOS) has no host networking to the
# LAN: use docker-compose.ports.yml there.
#   docker compose up -d     then open http://localhost:8080/
services:
  onvifsim:
    image: ghcr.io/treealarm/onvifsim:latest
    network_mode: host
    volumes:
      - onvifsim-data:/data
    restart: unless-stopped

volumes:
  onvifsim-data:
