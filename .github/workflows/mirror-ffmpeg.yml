name: Mirror ffmpeg

# The release packages bundle a GPL ffmpeg (libx264 is what encodes the H.264 streams) from
# BtbN/FFmpeg-Builds. Its dated builds disappear after a few weeks, so the release workflow downloads
# them from this repository's ffmpeg-mirror release instead, by name and SHA-256. Run this by hand to
# copy a new build there, then update the pins in release.yml.
on:
  workflow_dispatch:
    inputs:
      autobuild:
        description: "BtbN release tag (e.g. autobuild-2026-10-13-13-05)"
        required: true
      build:
        description: "Build inside it (e.g. n8.1.3-18-g46d899d7a0)"
        required: true

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      AUTOBUILD: ${{ inputs.autobuild }}
      BUILD: ${{ inputs.build }}
    steps:
      - name: Download from BtbN and check against its digests
        run: |
          set -euo pipefail
          series=$(echo "$BUILD" | sed -E 's/^n([0-9]+\.[0-9]+).*/\1/')
          mkdir files
          for target in linux64.tar.xz linuxarm64.tar.xz win64.zip; do
            name="ffmpeg-$BUILD-${target%%.*}-gpl-$series.${target#*.}"
            gh release download "$AUTOBUILD" -R BtbN/FFmpeg-Builds -p "$name" -D files
            digest=$(gh api "repos/BtbN/FFmpeg-Builds/releases/tags/$AUTOBUILD" --jq ".assets[] | select(.name == \"$name\") | .digest")
            echo "${digest#sha256:}  files/$name" | sha256sum -c -
          done
          (cd files && sha256sum *) | tee SHA256SUMS

      - name: Upload to the ffmpeg-mirror release
        run: |
          set -euo pipefail
          if ! gh release view ffmpeg-mirror -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create ffmpeg-mirror -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "ffmpeg builds bundled with the packages" \
              --notes "GPL builds of FFmpeg (with libx264) copied from https://github.com/BtbN/FFmpeg-Builds, which keeps its dated builds for a few weeks only. The release packages download them from here. FFmpeg is GPL-3.0-or-later; sources: https://ffmpeg.org/download.html and the build scripts at https://github.com/BtbN/FFmpeg-Builds. OnvifSim itself is MIT."
          fi
          gh release upload ffmpeg-mirror -R "$GITHUB_REPOSITORY" --clobber files/* SHA256SUMS
